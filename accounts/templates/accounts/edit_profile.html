{% extends "base.html" %}
{% load static %}

{% block title %}Edit Profile — EntrepShop{% endblock %}

{% block content %}
<div class="container" style="padding-top: 40px; padding-bottom: 60px; display: flex; justify-content: center;">
    <div class="profile-menu-card">
        <h2 style="font-family: var(--font-display); margin-bottom: 24px; color: var(--text);">Edit Profile</h2>
        
        <form method="POST" action="{% url 'accounts:update_profile' %}" enctype="multipart/form-data" class="address-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>

            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" name="avatar" accept="image/*">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 12px;">
                <button type="submit" class="btn-submit-orange" style="flex: 1;">Save Changes</button>
                <a href="{% url 'accounts:profile' %}" class="btn-outline btn-small" style="flex: 1; text-align: center; padding: 14px; text-decoration: none;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

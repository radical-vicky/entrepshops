{% extends "base.html" %}
{% block title %}Reset password — DrinkShop{% endblock %}

{% block content %}
<div class="container">
    <div class="page-head">
        <span class="eyebrow">Account</span>
        <h1>Reset your password</h1>
        <p class="lede">Enter your email and we'll send you a link to set a new one.</p>
    </div>
    <div class="form-card">
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Send reset link</button>
        </form>
    </div>
</div>
{% endblock %}

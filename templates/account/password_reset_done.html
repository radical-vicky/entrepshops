{% extends "base.html" %}
{% block title %}Check your email — DrinkShop{% endblock %}

{% block content %}
<div class="container">
    <div class="page-head">
        <span class="eyebrow">Account</span>
        <h1>Check your email</h1>
    </div>
    <div class="form-card">
        <p>We've sent you a link to reset your password. If it doesn't show up soon, check your spam folder.</p>
        <a href="{% url 'store:home' %}" class="btn btn-outline btn-small">Back to shop</a>
    </div>
</div>
{% endblock %}
